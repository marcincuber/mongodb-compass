services:
  compass:
    image: ${IMAGE_NAME:-mongodb-compass}:${IMAGE_TAG:-local}
    platform: linux/amd64
    build:
      context: .
    env_file:
      - path: ${COMPASS_ENV_FILE:-.env.runtime}
        format: raw
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-6080}:6080"
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - compass-config:/home/compass/.config
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  compass-config:
