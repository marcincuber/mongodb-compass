# DocumentDB 8.0 over TLS, with UI Basic authentication and HTTPS via Istio.
# Requires an existing DocumentDB 8.0 cluster and Istio ingress gateway.
# Replace image, database endpoint, credentials, browser hostname, and gateway selector.
# Create mongodb-compass-ui-tls in the ingress gateway workload namespace first.
apiVersion: v1
kind: Namespace
metadata:
  name: mongodb-compass
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-compass-secrets
  namespace: mongodb-compass
type: Opaque
stringData:
  UI_USERNAME: admin
  UI_PASSWORD: replace-with-a-strong-password
  # Database credentials are separate from the UI login.
  MONGODB_USERNAME: replace-with-documentdb-user
  MONGODB_PASSWORD: replace-with-documentdb-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-compass-config
  namespace: mongodb-compass
data:
  CONNECTION_TYPE: documentdb
  COMPASS_CONNECTION_NAME: "Amazon DocumentDB 8.0"
  # Point to an existing instance-based DocumentDB 8.0 cluster; the client cannot set its engine version.
  MONGODB_HOST: replace-me-v8.cluster-xxxxxxxxxxxx.eu-west-2.docdb.amazonaws.com
  MONGODB_PORT: "27017"
  MONGODB_AUTH_SOURCE: admin
  # DocumentDB startup rejects disabled TLS or certificate/hostname verification.
  MONGODB_TLS: "true"
  MONGODB_TLS_INSECURE: "false"
  MONGODB_TLS_ALLOW_INVALID_CERTIFICATES: "false"
  MONGODB_TLS_ALLOW_INVALID_HOSTNAMES: "false"
  MONGODB_TLS_CA_FILE: /opt/certs/global-bundle.pem
  MONGODB_REPLICA_SET: rs0
  MONGODB_READ_PREFERENCE: secondaryPreferred
  # Compatible with the full 8.0 family; retryable writes are optional from 8.0.2.
  MONGODB_RETRY_WRITES: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-compass
  namespace: mongodb-compass
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb-compass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb-compass
        # This example uses the ingress gateway without meshing the application pod.
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compass
          # Replace this with your published ECR image.
          image: 123456789012.dkr.ecr.eu-west-2.amazonaws.com/mongodb-compass:1.53.2-6
          ports:
            - name: http
              containerPort: 6080
          envFrom:
            - configMapRef:
                name: mongodb-compass-config
            - secretRef:
                name: mongodb-compass-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
              ephemeral-storage: 3Gi
          startupProbe:
            exec:
              command: [python3, /opt/compass-container/healthcheck.py]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: [python3, /opt/compass-container/healthcheck.py]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [python3, /opt/compass-container/healthcheck.py]
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: home
              mountPath: /home/compass
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: home
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-compass
  namespace: mongodb-compass
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongodb-compass
  ports:
    - name: http
      port: 6080
      targetPort: http
---
# Put the Gateway resource and its TLS Secret in the ingress workload namespace.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: mongodb-compass-gateway
  namespace: istio-system
spec:
  # Replace with the labels on your existing ingress gateway workload.
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http-compass
        protocol: HTTP
      hosts:
        - compass.example.com
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https-compass
        protocol: HTTPS
      hosts:
        - compass.example.com
      tls:
        mode: SIMPLE
        credentialName: mongodb-compass-ui-tls
        minProtocolVersion: TLSV1_2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: mongodb-compass
  namespace: mongodb-compass
spec:
  hosts:
    - compass.example.com
  gateways:
    - istio-system/mongodb-compass-gateway
  http:
    - name: compass-ui-and-websocket
      match:
        - uri:
            prefix: /
      # No rewrites: forward both noVNC assets and /websockify to the authenticated gateway.
      # Disable the route request timeout for long-running desktop connections.
      timeout: 0s
      route:
        - destination:
            host: mongodb-compass.mongodb-compass.svc.cluster.local
            port:
              number: 6080
