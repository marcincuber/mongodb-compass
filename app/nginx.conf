worker_processes 1;
pid @RUNTIME@/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    client_body_temp_path @RUNTIME@/client-temp;
    proxy_temp_path @RUNTIME@/proxy-temp;
    fastcgi_temp_path @RUNTIME@/fastcgi-temp;
    uwsgi_temp_path @RUNTIME@/uwsgi-temp;
    scgi_temp_path @RUNTIME@/scgi-temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 6080;
        server_name _;
        auth_basic "MongoDB Compass";
        auth_basic_user_file @RUNTIME@/htpasswd;

        # Only this static response is public; it cannot access application data.
        location = /healthz {
            auth_basic off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://127.0.0.1:6081;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Authorization "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
