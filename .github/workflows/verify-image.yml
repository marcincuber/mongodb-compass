name: Verify container image

on:
  workflow_call:
    inputs:
      compass_version:
        type: string
        default: ''
      compass_sha256:
        type: string
        default: ''
      source_sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: Tests and HIGH/CRITICAL scan gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE_NAME: mongodb-compass
      IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPASS_VERSION: ${{ inputs.compass_version }}
      COMPASS_SHA256: ${{ inputs.compass_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install test tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          mkdir -p "$RUNNER_TEMP/tools"
          curl --fail --show-error --location --retry 3 \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/kubeconform.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/tools" kubeconform
          curl --fail --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/tools" actionlint
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: GitHub Actions workflow validation
        run: actionlint
      - name: Unit tests and shell validation
        run: make test
      - name: Kubernetes and Istio schemas
        run: make eks-validate
      - name: Build fresh Linux amd64 image
        run: ./scripts/build.sh --pull --no-cache
      - name: Desktop, authentication, secrets, persistence, and shutdown
        run: make smoke-test
      - name: Scan image and enforce zero HIGH/CRITICAL findings
        id: scan
        run: make scan
      - name: Upload security reports (including failed scans)
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 30
