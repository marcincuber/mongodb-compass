name: Upgrade Compass

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      compass_version:
        description: Stable Compass version (for example 1.53.2), or latest
        type: string
        default: latest
        required: true

permissions:
  contents: read

concurrency:
  group: compass-upgrade
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve official Compass release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.release.outputs.sha256 }}
      changed: ${{ steps.release.outputs.changed }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve stable release and published installer checksum
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.compass_version || 'latest' }}
        run: python3 scripts/upgrade_compass.py --version "$REQUESTED_VERSION" --check --github-output "$GITHUB_OUTPUT"
      - name: Upgrade summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANGED: ${{ steps.release.outputs.changed }}
        run: |
          printf '## Compass upgrade\n\nCandidate: %s\n\nVersion change needed: %s\n\nTests and the security gate run even when already up to date.\n' "$VERSION" "$CHANGED" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Validate candidate
    needs: resolve
    uses: ./.github/workflows/verify-image.yml
    with:
      compass_version: ${{ needs.resolve.outputs.version }}
      compass_sha256: ${{ needs.resolve.outputs.sha256 }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  pull-request:
    name: Open tested upgrade PR
    needs: [resolve, verify]
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - name: Apply the tested release pins
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CHECKSUM: ${{ needs.resolve.outputs.sha256 }}
        run: python3 scripts/upgrade_compass.py --version "$VERSION" --expected-sha256 "$CHECKSUM"
      - name: Create or update pull request
        id: pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/upgrade-compass
          delete-branch: true
          title: Upgrade MongoDB Compass to ${{ needs.resolve.outputs.version }}
          commit-message: Upgrade MongoDB Compass to ${{ needs.resolve.outputs.version }}
          add-paths: |
            Dockerfile
            README.md
            docs/publishing.md
            k8s/examples/*.yaml
          body: |
            Upgrade the official Linux amd64 Compass installer and its published SHA-256 pin, plus documentation and Kubernetes image examples.

            Validation passed before this PR was opened: unit tests, ShellCheck, Kubernetes/Istio schemas, a fresh image build, real GUI/authentication/persistence smoke tests, and a container scan with **0 HIGH and 0 CRITICAL findings** (including unfixed findings).

            Validation and reports: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Review and merge manually. This workflow does not publish to ECR or deploy to Kubernetes.
      - name: Link upgrade pull request
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          printf '\nUpgrade PR: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
